
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#315b45">
<title>La aventura jurásica de Mateo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: linear-gradient(145deg, #d8e9cf, #f8f0d9);
  font-family: Arial, sans-serif;
  color: #244333;
}

.card {
  width: min(100%, 520px);
  overflow: hidden;
  border-radius: 28px;
  background: #fff9e9;
  box-shadow: 0 18px 55px #24433325;
  border: 3px solid white;
}

.hero {
  padding: 26px 20px 24px;
  text-align: center;
  background: linear-gradient(160deg, #315b45, #6d9567);
  color: white;
}

.dinos {
  font-size: 46px;
  letter-spacing: 8px;
}

h1 {
  font-size: clamp(29px, 7vw, 38px);
  margin: 14px 0;
  font-weight: 900;
}

.message {
  font-size: 17px;
  line-height: 1.5;
  margin: 0 auto;
  max-width: 390px;
}

.content {
  padding: 25px 18px 28px;
  text-align: center;
}

.date {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #315b45;
}

.time {
  margin-top: 7px;
  font-weight: bold;
  color: #68835e;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  margin: 25px 0 12px;
}

.unit {
  background: #e8f2df;
  border: 1px solid #c9ddc0;
  border-radius: 16px;
  padding: 15px 3px 12px;
}

.num {
  font-size: clamp(25px, 7vw, 39px);
  font-weight: 900;
  line-height: 1;
  color: #315b45;
  font-variant-numeric: tabular-nums;
}

.label {
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 800;
  margin-top: 9px;
  color: #66805d;
}

.whatsapp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 22px;
  padding: 15px 20px;
  border-radius: 999px;
  background: #25d366;
  color: #123b27;
  text-decoration: none;
  font-weight: 900;
  font-size: 15px;
  box-shadow: 0 5px 0 #1da851;
  transition: transform .15s ease;
}

.whatsapp:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #1da851;
}

@media (max-width: 360px) {
  .grid {
    gap: 5px;
  }
  .unit {
    padding: 12px 2px;
  }
  .label {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<main class="card">

  <header class="hero">
    <div class="dinos">🦕 🦖 🌋</div>

    <h1>¡ROOOAAAR! 🦖</h1>

    <p class="message">
      Estoy preparando una fiestita jurásica
      y me haría muy feliz que vinieras
      a celebrar conmigo. 💚
    </p>
  </header>

  <section class="content">

    <div class="date">22 DE NOVIEMBRE DE 2026</div>
    <div class="time">3:00 DE LA TARDE</div>

    <div class="grid" aria-live="off">

      <div class="unit">
        <div class="num" id="days">--</div>
        <div class="label">DÍAS</div>
      </div>

      <div class="unit">
        <div class="num" id="hours">--</div>
        <div class="label">HORAS</div>
      </div>

      <div class="unit">
        <div class="num" id="minutes">--</div>
        <div class="label">MINUTOS</div>
      </div>

      <div class="unit">
        <div class="num" id="seconds">--</div>
        <div class="label">SEGUNDOS</div>
      </div>

    </div>

    <a
      class="whatsapp"
      href="https://wa.me/573143477193?text=Hola%2C%20confirmo%20asistencia"
      target="_blank"
      rel="noopener noreferrer">
      💌 Toca aquí y dile a mi mami que sí vienes
    </a>

  </section>

</main>

<script>
const target = new Date(
  "2026-11-22T15:00:00-05:00"
).getTime();

const pad = n => String(n).padStart(2, "0");

function updateCountdown() {

  let diff = target - Date.now();

  if (diff <= 0) {
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    return;
  }

  const days = Math.floor(diff / 86400000);
  diff %= 86400000;

  const hours = Math.floor(diff / 3600000);
  diff %= 3600000;

  const minutes = Math.floor(diff / 60000);
  diff %= 60000;

  const seconds = Math.floor(diff / 1000);

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = pad(hours);
  document.getElementById("minutes").textContent = pad(minutes);
  document.getElementById("seconds").textContent = pad(seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
