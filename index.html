<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315b45">
<title>Cuenta regresiva jurásica de Mateo</title>
<style>
:root{--green:#315b45;--mint:#e8f2df;--cream:#fff9e9;--leaf:#8eaf78;--dark:#244333}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#d8e9cf,#f8f0d9);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--dark)}
.card{width:min(100%,520px);overflow:hidden;border-radius:28px;background:var(--cream);box-shadow:0 18px 55px #24433325;border:3px solid #fff}
.hero{padding:26px 20px 20px;text-align:center;background:linear-gradient(160deg,#315b45,#6d9567);color:#fff}
.dinos{font-size:46px;letter-spacing:8px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;opacity:.9;margin-top:8px}
h1{font-size:clamp(26px,7vw,38px);line-height:1.08;margin:10px 0 6px}.sub{font-size:15px;opacity:.95}
.content{padding:24px 18px 22px;text-align:center}
.date{font-size:18px;font-weight:900;letter-spacing:1px;color:var(--green)}
.time{margin-top:4px;font-weight:700;color:#68835e}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:23px 0 16px}
.unit{background:var(--mint);border:1px solid #c9ddc0;border-radius:16px;padding:14px 4px 11px}
.num{font-size:clamp(27px,8vw,39px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--green)}
.label{font-size:10px;letter-spacing:1px;font-weight:800;margin-top:8px;color:#66805d}
.message{font-size:15px;line-height:1.5;margin:14px auto 0;max-width:390px}
.foot{margin-top:18px;font-size:27px}.small{font-size:11px;color:#71836a;margin-top:13px}
@media(max-width:360px){.grid{gap:5px}.unit{padding:12px 2px}.label{font-size:9px}}
</style>
</head>
<body>
<main class="card">
  <header class="hero">
    <div class="dinos">🦕 🦖 🌋</div>
    <div class="eyebrow">🚨 ¡PELIGRO! 🦖</div>
    <h1>Dinosaurio pequeño, mordelón y demasiado consentido…<br>¡cerca de cumplir años! 😂</h1>
    <div class="sub">¡Que se prepare toda la manada!</div>
  </header>
  <section class="content">
    <div class="date">22 DE NOVIEMBRE DE 2026</div>
    <div class="time">3:00 DE LA TARDE</div>
    <div class="grid" aria-live="off">
      <div class="unit"><div class="num" id="days">--</div><div class="label">DÍAS</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">HORAS</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTOS</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">SEGUNDOS</div></div>
    </div>
  </section>
</main>
<script>
const target = new Date("2026-11-22T15:00:00-05:00").getTime();
const pad = n => String(n).padStart(2,"0");
function update(){
  let diff = target - Date.now();
  if(diff <= 0){
    ["days","hours","minutes","seconds"].forEach(id=>document.getElementById(id).textContent="00");
    return;
  }
  const d=Math.floor(diff/86400000); diff%=86400000;
  const h=Math.floor(diff/3600000); diff%=3600000;
  const m=Math.floor(diff/60000); diff%=60000;
  const s=Math.floor(diff/1000);
  document.getElementById("days").textContent=d;
  document.getElementById("hours").textContent=pad(h);
  document.getElementById("minutes").textContent=pad(m);
  document.getElementById("seconds").textContent=pad(s);
}
update(); setInterval(update,1000);
</script>
</body>
</html>
